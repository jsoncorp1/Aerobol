name: Build and tests
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python build.py
      - run: git diff --exit-code -- index.html landing.html privacidad/index.html terminos/index.html cookies/index.html
      - run: node --test Tests/carga.test.cjs
      - run: dotnet test Tests/Aerobol.Tests.csproj --configuration Release
      - run: dotnet publish Monolito/Aerobol.csproj --configuration Release --output /tmp/aerobol-publish
